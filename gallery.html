<!DOCTYPE html>
<html>
<head>
  <title>My Gallery</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: gray;
      color: white;
      font-family: Arial, sans-serif;
    }
    
    header {
          border-bottom: 2px solid white;
        }

    /* Navigation */
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: space-between;
      align-items: center;
      padding: 24px 5%;
    }

    .logo {
      font-weight: bold;
      color: red;
      font-size: 25px;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
    }

    .nav-links a {
      color: black;
      text-decoration: none;
      font-size: 14px;
    }

    .nav-links a.active {
      font-weight: bold;
      border-bottom: 2px solid black;
    }

    /* Gallery */
    .gallery {
      padding: 10px 5% 30px;
    }

    .gallery h1 {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .gallery p {
      margin-bottom: 20px;
    }

    .gallery img {
      width: 150px;
      height: 130px;
      object-fit: cover;
      margin: 5px;
      border-radius: 8px;
    }

    /* Malaking picture */
    #bigPicture {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    #bigPicture img {
      width: 500px;
      max-width: 90%;
      max-height: 70%;
      object-fit: contain;
      border-radius: 10px;
    }

    #bigPicture button {
      background: red;
      color: white;
      border: none;
      padding: 8px 24px;
      border-radius: 20px;
      font-size: 14px;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      border-top: 2px solid white;
      color: black;
      font-size: 13px;
    }
  </style>
</head>

<body>
    <header>
  <nav>
    <div class="logo">JaCram.com</div>
    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="aboutMe.html">About Me</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="gallery.html" class="active">Gallery</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>
    </header>
  
  <div class="gallery">
    <h1>My Gallery</h1>
    <p>Here are some of my photos.</p>

    <img src="museum.jpg" alt="Museum" onclick="showImage(this)">
    <img src="Swimming.jpeg" alt="Photo 2" onclick="showImage(this)">
    <img src="Withcap.webp" alt="Photo 3" onclick="showImage(this)">
    <img src="yy.jpeg" alt="Photo 4" onclick="showImage(this)">
    <br>
    <img src="P.E.jpeg" alt="Photo 5" onclick="showImage(this)">
    <img src="first.jpeg" alt="Photo 6" onclick="showImage(this)">
  </div>

  <div id="bigPicture"></div>

  <footer>&copy; 2026 My Website</footer>

  <script>
    function showImage(image) {
      const big = document.getElementById("bigPicture");
      big.innerHTML =
        "<img src='" + image.src + "' alt='" + image.alt + "'>" +
        "<button onclick='hideImage()'>Close</button>";
      big.style.display = "flex";
    }

    function hideImage() {
      const big = document.getElementById("bigPicture");
      big.innerHTML = "";
      big.style.display = "none";
    }
  </script>

</body>
</html>
